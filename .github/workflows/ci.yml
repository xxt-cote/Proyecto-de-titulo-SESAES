# Integración continua: corre las pruebas del backend y del frontend en cada cambio.
# Si algo se rompe, GitHub lo marca en rojo antes de fusionar el Pull Request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Las pruebas usan SQLite en memoria; las marcadas "postgres" se saltan solas.
      DATABASE_URL: "sqlite:///:memory:"
      JWT_SECRET_KEY: clave-solo-para-ci-no-usar-en-produccion-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Auditoría de dependencias (informativa)
        continue-on-error: true      # cuando el equipo la tenga limpia, quitar esta línea para que bloquee
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    name: Frontend (tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
      - name: Auditoría de dependencias de producción (informativa)
        continue-on-error: true      # cuando el equipo la tenga limpia, quitar esta línea para que bloquee
        run: npm audit --omit=dev --audit-level=high
